<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda Nails</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <input type="checkbox" id="menu" aria-label="Abrir menu">
  <header>
    <label for="menu" class="burger" aria-label="Abrir menu"><span class="burger-icon" aria-hidden="true"></span></label>
    <h1>Agenda Nails</h1>
  </header>
  <nav aria-label="Navegação principal">
    <a href="/">Início</a>
    <a href="/agendar">Novo agendamento</a>
    <a href="/servicos">Serviços</a>
    <a href="/sad">Apoio à decisão</a>
    <a href="/financas">Finanças</a>
    <a href="/gastos">Gastos</a>
  </nav>
  <label for="menu" class="veu" aria-label="Fechar menu"></label>
  <main>
    {% for m in get_flashed_messages() %}<div class="flash" role="status">{{ m }}</div>{% endfor %}
    {% block c %}{% endblock %}
  </main>
</body>
</html>
