{% extends "base.html" %}{% macro form(s) %}
<form method="post" action="/servicos/salvar">{% if s %}<input type="hidden" name="id" value="{{s.id}}">{% endif %}
<label>Nome</label><input name="nome" required value="{{s.nome if s}}">
<div class="grid"><div><label>Preço (R$)</label><input name="preco" type="number" step="0.01" required value="{{s.preco if s}}"></div>
<div><label>Custo direto (R$)</label><input name="custo" type="number" step="0.01" required value="{{s.custo if s}}"></div></div>
<label>Horas que leva (ex: 2,5)</label><input name="horas" type="number" step="0.25" min="0.25" required value="{{s.horas if s}}">
<br><button class="btn">Salvar</button></form>{% endmacro %}
{% block c %}<h2>💎 Serviços</h2>
<details class="card"><summary>＋ Novo serviço</summary>{{ form(none) }}</details>
{% for s in lista %}<details class="card"><summary>{{s.nome}}<br><small>{{s.preco|brl}} · custo {{s.custo|brl}} · {{s.horas}}h</small></summary>
{{ form(s) }}<form method="post" action="/servicos/{{s.id}}/excluir" onsubmit="return confirm('Remover serviço?')"><br><button class="btn cinza mini">Remover</button></form></details>{% endfor %}{% endblock %}
